name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Run pytest
        run: pytest -q
      - name: Shell syntax check
        run: |
          for f in src/vmps_geometry/*.sh; do bash -n "$f"; done
      - name: shellcheck (advisory)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning src/vmps_geometry/*.sh || true
