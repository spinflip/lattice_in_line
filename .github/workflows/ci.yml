name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (validates metadata) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run pytest
        run: pytest -q
      - name: NNN tables are up to date (regenerate and diff)
        run: |
          vmps-build-nnn-tables
          git diff --exit-code -- src/vmps_geometry/cluster_edges_NNN.py \
            || { echo "::error::cluster_edges_NNN.py is stale; run vmps-build-nnn-tables and commit"; exit 1; }
      - name: Shell syntax check
        run: |
          for f in src/vmps_geometry/*.sh; do bash -n "$f"; done
      - name: shellcheck (advisory)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning src/vmps_geometry/*.sh || true
