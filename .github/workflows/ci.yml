name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (validates metadata) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run pytest
        run: pytest -q
      - name: NNN table generator smoke test
        run: |
          lil-build-nnn-tables   # generated artifact (not shipped); ensure it builds
      - name: Shell syntax check
        run: |
          for f in src/lattice_in_line/*.sh; do bash -n "$f"; done
      - name: shellcheck (advisory)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning src/lattice_in_line/*.sh || true
