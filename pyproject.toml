[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice_in_line"
version = "0.3.0"
description = "Geometry helpers, cluster graphs, permutations, and unit-cell files for VMPS"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "networkx",
]

[project.optional-dependencies]
# Cluster plotting (vmps-cluster-generator). Without it, plots are skipped.
plot = ["matplotlib"]
# Bandwidth certification: CP-SAT solver + independent SAT cross-check.
certify = ["ortools", "python-sat"]
# Orbit (Aut(G)) symmetry breaking. Optional; the certifier falls back to
# reversal symmetry when absent. Prebuilt wheels can be CPU-incompatible.
orbits = ["pynauty"]
# QUBO experiment track (qubo/*, uses scipy's reverse Cuthill-McKee).
qubo = ["scipy"]
# Test suite.
dev = ["pytest"]
# Everything.
all = ["matplotlib", "ortools", "python-sat", "pynauty", "scipy"]

[project.scripts]
lil-cluster-generator = "lattice_in_line.cluster_generator:main"
lil-bandwidth-certifier = "lattice_in_line.bandwidth_certifier:main"
lil-fiedler-ordering = "lattice_in_line.fiedler_ordering:main"
lil-dmrg-log-to-json = "lattice_in_line.dmrg_log_to_json:main"
lil-build-nnn-tables = "lattice_in_line.build_cluster_edges_NNN:main"
lil-bandwidth-benchmark = "lattice_in_line.bandwidth_heuristics_benchmark:main"
lil-bandwidth-cutwidth-correlation = "lattice_in_line.bandwidth_cutwidth_correlation:main"
lil-gather-permutations = "lattice_in_line.gather_permutations:main"
lil-analyze-mpo-correlation = "lattice_in_line.analyze_mpo_correlation:main"
lil-qubo-bandwidth = "lattice_in_line.qubo.bandwidth_qubo_tsq:main"
lil-qubo-classical-compare = "lattice_in_line.qubo.bandwidth_classical_compare:main"
lil-qubo-sweep = "lattice_in_line.qubo.sweep_bandwidth_qubo_tsq:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lattice_in_line = [
    "permutations*.py",
    "unit_cell/*.py",
    "*.sh",
]
# Vendored C++ QUBO solvers (built out-of-tree; see qubo/cpp/Makefile).
"lattice_in_line.qubo" = [
    "cpp/Makefile",
    "cpp/*.cpp",
    "cpp/libtsqubo/tsqubo.h",
    "cpp/libtsqubo/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
