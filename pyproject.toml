[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice_in_line"
version = "0.2.0"
description = "Geometry helpers, cluster graphs, permutations, and unit-cell files for VMPS"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "networkx",
]

[project.optional-dependencies]
# Cluster plotting (vmps-cluster-generator). Without it, plots are skipped.
plot = ["matplotlib"]
# Bandwidth certification: CP-SAT solver + independent SAT cross-check.
certify = ["ortools", "python-sat"]
# Orbit (Aut(G)) symmetry breaking. Optional; the certifier falls back to
# reversal symmetry when absent. Prebuilt wheels can be CPU-incompatible.
orbits = ["pynauty"]
# QUBO experiment track (qubo/*, uses scipy's reverse Cuthill-McKee).
qubo = ["scipy"]
# Test suite.
dev = ["pytest"]
# Everything.
all = ["matplotlib", "ortools", "python-sat", "pynauty", "scipy"]

[project.scripts]
vmps-cluster-generator = "vmps_geometry.cluster_generator:main"
vmps-bandwidth-certifier = "vmps_geometry.bandwidth_certifier:main"
vmps-fiedler-ordering = "vmps_geometry.fiedler_ordering:main"
vmps-dmrg-log-to-json = "vmps_geometry.dmrg_log_to_json:main"
vmps-build-nnn-tables = "vmps_geometry.build_cluster_edges_NNN:main"
vmps-bandwidth-benchmark = "vmps_geometry.bandwidth_heuristics_benchmark:main"
vmps-bandwidth-cutwidth-correlation = "vmps_geometry.bandwidth_cutwidth_correlation:main"
vmps-gather-permutations = "vmps_geometry.gather_permutations:main"
vmps-analyze-mpo-correlation = "vmps_geometry.analyze_mpo_correlation:main"
vmps-qubo-bandwidth = "vmps_geometry.qubo.bandwidth_qubo_tsq:main"
vmps-qubo-classical-compare = "vmps_geometry.qubo.bandwidth_classical_compare:main"
vmps-qubo-sweep = "vmps_geometry.qubo.sweep_bandwidth_qubo_tsq:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vmps_geometry = [
    "permutations*.py",
    "unit_cell/*.py",
    "*.sh",
]
# Vendored C++ QUBO solvers (built out-of-tree; see qubo/cpp/Makefile).
"vmps_geometry.qubo" = [
    "cpp/Makefile",
    "cpp/*.cpp",
    "cpp/libtsqubo/tsqubo.h",
    "cpp/libtsqubo/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
